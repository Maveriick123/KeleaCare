<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot UI</title>
    <link rel="stylesheet" href="styles.css"> <!-- Enlace al archivo CSS -->
    <script src="script.js"></script>
</head>

<body>

    <div class="main-container">
        <div class="chat-history">
            <span class="close-history" onclick="toggleHistory()">✖</span>
            <h2>Historial de Chats</h2>
            <ul>
                <li>Chat 1</li>
                <li>Chat 2</li>
                <li>Chat 3</li>
            </ul>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <img src="./Image/historial.png" class="open-history" onclick="toggleHistory()" style="display: none; cursor: 
                pointer; width: 30px; height: 30px;">
                <span class="chat-title">Kelea</span>
                <img src="./Image/Logo_relleno.png" class="chat-logo">
                <span class="chat-title">Care</span>
                <a href="login.html" class="user-circle"></a>
            </div>
            <div class="chat-messages">
                <div class="message message-bot">
                    <div class="message-content">Hola, ¿cómo te sientes hoy?</div>
                </div>
                <div class="message message-user">
                    <div class="message-content">Me siento un poco ansioso.</div>
                </div>
            </div>

            <div class="chat-input">
                <input type="text" placeholder="Escribe un mensaje...">
                <button onclick = "sendMessage()">Enviar</button>
            </div>

        </div>
    </div>

</body>

</html>
