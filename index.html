<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot UI</title>
    <link rel="stylesheet" href="styles.css"> <!-- Enlace al archivo CSS -->
</head>
<body>

    <div class="main-container">
        <div class="chat-history" id="chatHistory">
            <span class="close-history" onclick="toggleHistory()">✖</span>
            <h2>Historial de Chats</h2>
            <ul>
                <li>Chat 1</li>
                <li>Chat 2</li>
                <li>Chat 3</li>
            </ul>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <div class="chat-header">
                <img src="./Image/historial.png" class="open-history" id="openHistory" onclick="toggleHistory()" style="display: none; cursor: 
                pointer; width: 30px; height: 30px;">
              <span class="chat-title">Kelea</span>
              <img src="./Image/Logo_relleno.png" class="chat-logo">
              <span class="chat-title">Care</span>
                <a href="login.html" class="user-circle"></a>
            </div>
                <div class="chat-messages" id="chatMessages">
                <div class="message message-bot">
                    <div class="message-content">Hola, ¿cómo te sientes hoy?</div>
                </div>
                <div class="message message-user">
                    <div class="message-content">Me siento un poco ansioso.</div>
                </div>
            </div>

            <div class="chat-input">
                <input type="text" placeholder="Escribe un mensaje...">
                <button>Enviar</button>
            </div>
        </div>
    </div>
    
    <script>
        function toggleLoginMenu(event) {
            var menu = document.getElementById("loginMenu");
            var userCircle = document.querySelector(".user-circle");
            
            if (menu.style.display === "block") {
                menu.style.display = "none";
            } else {
                menu.style.display = "block";
            }
            
            event.stopPropagation(); // Evita que el clic cierre inmediatamente el menú
        }

        document.addEventListener("click", function(event) {
            var menu = document.getElementById("loginMenu");
            var userCircle = document.querySelector(".user-circle");
            
            // Cierra el menú si el clic no es en el icono de usuario ni en el menú
            if (menu.style.display === "block" && !userCircle.contains(event.target) && !menu.contains(event.target)) {
                menu.style.display = "none";
            }
        });

        function toggleHistory() {
            var history = document.getElementById('chatHistory');
            var chat = document.getElementById('chatContainer');
            var openHistory = document.getElementById('openHistory');
            
            if (history.classList.contains("hidden")) {
                history.classList.remove("hidden");
                chat.classList.remove("fullscreen");
                openHistory.style.display = "none";
            } else {
                history.classList.add("hidden");
                chat.classList.add("fullscreen");
                openHistory.style.display = "block";
            }
        }
    </script>

</body>
</html>
